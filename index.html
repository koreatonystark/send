  // ------------------------------------------------------------------ box drawing
  function boxSvg(ratio, row, showPct) {
    const L = st.L, W = st.W, H = st.H;
    const k = 0.55, ang = Math.PI / 6, dx = Math.cos(ang) * k, dy = Math.sin(ang) * k;
    const maxW = 300, maxH = 226;
    let s = Math.min(maxW / (L + W * dx), maxH / (H + W * dy));
    let fw = L * s, fh = Math.max(H * s, 16), ddx = W * s * dx, ddy = W * s * dy;
    const ox = 92 + (maxW - (fw + ddx)) / 2, oy = 44 + ddy + (maxH - (fh + ddy)) / 2;
    const x0 = ox, y0 = oy, x1 = ox + fw, y1 = oy + fh;            // front face
    const P = (pts) => pts.map(p => p.map(v => v.toFixed(1)).join(',')).join(' ');
    const fillH = fh * ratio, yf = y1 - fillH;
    const full = ratio >= 0.999;
    const lbl = (unitNow() === 'in') ? (v => `${r1(v).replace(/\.0$/, '')}″`) : (v => `${Math.round(v * CM)} cm`);
    const alt = (unitNow() === 'in') ? (v => `${cvf(v * CM)} cm`) : (v => `${r1(v).replace(/\.0$/, '')}″`);
    const t2 = (x, v) => `<tspan x="${x}" dy="16" font-size="12.5" font-weight="600" fill="#8fb3cc">${alt(v)}</tspan>`;
    const kg = st.lb * KG;
    const pct = Math.round(ratio * 100);
    const g = [];
    g.push(`<svg class="dts-boxsvg" viewBox="0 0 460 330" role="img" aria-label="box">`);
    g.push(`<defs><pattern id="dts-hatch" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)"><line x1="0" y1="0" x2="0" y2="8" stroke="#3a5470" stroke-width="2"/></pattern></defs>`);
    // empty faces
    g.push(`<polygon points="${P([[x0, y0], [x1, y0], [x1 + ddx, y0 - ddy], [x0 + ddx, y0 - ddy]])}" fill="${full ? '#e0a63c' : '#1d3044'}" stroke="#e8c27a" stroke-width="2"/>`);
    g.push(`<polygon points="${P([[x0, y0], [x1, y0], [x1, y1], [x0, y1]])}" fill="url(#dts-hatch)" stroke="none"/>`);
    g.push(`<polygon points="${P([[x1, y0], [x1 + ddx, y0 - ddy], [x1 + ddx, y1 - ddy], [x1, y1]])}" fill="url(#dts-hatch)" stroke="none" opacity=".7"/>`);
    // filled part (real weight share), from the bottom
    if (fillH > 0.5) {
      g.push(`<polygon points="${P([[x0, yf], [x1, yf], [x1, y1], [x0, y1]])}" fill="#d9932b"/>`);
      g.push(`<polygon points="${P([[x1, yf], [x1 + ddx, yf - ddy], [x1 + ddx, y1 - ddy], [x1, y1]])}" fill="#a86c16"/>`);
      if (!full) g.push(`<polygon points="${P([[x0, yf], [x1, yf], [x1 + ddx, yf - ddy], [x0 + ddx, yf - ddy]])}" fill="#f2b84b" opacity=".85"/>`);
    }
    // outline
    g.push(`<polyline points="${P([[x0, y0], [x0, y1], [x1, y1], [x1 + ddx, y1 - ddy], [x1 + ddx, y0 - ddy]])}" fill="none" stroke="#e8c27a" stroke-width="2.2"/>`);
    g.push(`<polyline points="${P([[x0, y0], [x1, y0], [x1, y1]])}" fill="none" stroke="#e8c27a" stroke-width="2.2"/>`);
    g.push(`<line x1="${x1}" y1="${y0}" x2="${x1 + ddx}" y2="${y0 - ddy}" stroke="#e8c27a" stroke-width="2.2"/>`);
    if (!full && fillH > 0.5) g.push(`<line x1="${x0}" y1="${yf}" x2="${x1}" y2="${yf}" stroke="#fff3d6" stroke-width="1.5" stroke-dasharray="5 4"/>`);
    // dimension labels
    g.push(`<g font-family="system-ui,sans-serif" font-weight="700" fill="#e8f0f8" font-size="15">`);
    g.push(`<text x="${(x0 + x1) / 2}" y="${y1 + 20}" text-anchor="middle">가로 ${lbl(L)} ${'<tspan font-size="12.5" font-weight="600" fill="#8fb3cc">' + alt(L) + '</tspan>'}</text>`);
    g.push(`<text x="${x0 - 8}" y="${(y0 + y1) / 2 - 6}" text-anchor="end">높이 ${lbl(H)}${t2(x0 - 8, H)}</text>`);
    const tx = x1 + ddx / 2 + 8, far = tx > 360;
    const wx = far ? x1 + ddx : tx;
    g.push(`<text x="${wx}" y="${far ? y1 - ddy + 4 + 16 : y1 - ddy / 2 + 10}" text-anchor="${far ? 'end' : 'start'}">세로 ${lbl(W)}${t2(wx, W)}</text>`);
    g.push(`</g>`);
    // centre label on the front face
    const cy = (y0 + y1) / 2, big = fh > 70;
    g.push(`<g font-family="system-ui,sans-serif" text-anchor="middle">`);
    g.push(`<text x="${(x0 + x1) / 2}" y="${big ? cy - 6 : cy + 6}" font-size="${big ? 34 : 22}" font-weight="800" fill="#fff" stroke="#0e1823" stroke-width="4" paint-order="stroke">${showPct ? pct + '%' : '실무게'}</text>`);
    if (big) g.push(`<text x="${(x0 + x1) / 2}" y="${cy + 22}" font-size="14" font-weight="700" fill="#fff" stroke="#0e1823" stroke-width="3" paint-order="stroke">⚖ ${lbs(st.lb)} lb · ${kgs(kg)} kg</text>`);
    g.push(`</g>`);
    // weight tag top-left (only when the box is too flat to carry it)
    if (!big) g.push(`<g font-family="system-ui,sans-serif"><rect x="8" y="8" rx="9" width="170" height="30" fill="#0e1823" stroke="#39597a"/><text x="18" y="28" font-size="15" font-weight="700" fill="#f2b84b">⚖ 무게 ${lbs(st.lb)} lb (${kgs(kg)} kg)</text></g>`);
    g.push(`</svg>`);
    return g.join('');
  }

      + bars(15 - d * ux, 10 - d * uy, 123.69, [1, 1, 1]) + bars(15 + d * ux, 10 + d * uy, 123.69, [0, 0, 0])
      + bars(15 + d * ux, 10 - d * uy, 56.31, [0, 1, 0]) + bars(15 - d * ux, 10 + d * uy, 56.31, [1, 0, 1])

    const rowHtml = (r, i) => `

  function step(key, d) {
    const u = unitNow() === 'in';
    if (key === 'lb') {
      const inc = u ? 0.5 : 0.2 / KG;
      st.lb = Math.min(150, Math.max(0.25, Math.round((st.lb + d * inc) * 100) / 100));
    } else {
      const inc = u ? (st[key] < 2 ? 0.25 : 1) : 1 / CM;
      let v = st[key] + d * inc;
      if (u) v = Math.round(v * 4) / 4;
      st[key] = Math.min(108, Math.max(0.25, v));
      st.frBox = null;
    }
  }
